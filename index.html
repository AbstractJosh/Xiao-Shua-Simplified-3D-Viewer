<!doctype html>
<!-- The default theme is written here rather than only by the app, so the
     first paint is already themed: a script that sets it after mount repaints
     the whole window, which is the flash a theme system is usually bought to
     prevent. See src/theme.ts. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- THE APP'S FACE, in every theme. It arrived as the one the Cyberpunk
         theme asks for and was worn only by that theme's headings; the whole
         console is set in it now, which is why it is preconnected and fetched up
         front rather than injected when a theme is picked. A stylesheet that
         lands after first paint reflows every label in the window.

         `display=swap` and the fallbacks in --font still mean the app never waits
         on it. Offline, the console comes up in the system stack at the sizes
         Rajdhani was measured for -- a shade large, and entirely usable.

         Four weights, and all four are drawn: 500 is the body, 600 the headings
         and the states that press, 700 the wordmark, 400 the few places this
         file asks for something lighter than its own normal. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
    />
    <title>Xiao Shua's 3D Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
